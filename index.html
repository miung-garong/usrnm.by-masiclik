<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Instagram Username Generator by VINS</title>

<link rel="icon" type="image/png" href="favicon.png">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:#050505;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.container{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:25px 18px 40px;
}

.header{
    text-align:center;
    margin-bottom:25px;
}

.logo{
    font-size:42px;
    font-weight:900;
    letter-spacing:8px;
    color:#ff0000;
    text-shadow:0 0 15px rgba(255,0,0,.35);
}

.subtitle{
    margin-top:5px;
    font-size:12px;
    letter-spacing:4px;
    color:#888;
}

.card{
    background:#0d0d0d;
    border:1px solid #242424;
    border-radius:14px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 0 25px rgba(255,0,0,.04);
}

.controls{
    display:grid;
    grid-template-columns:1fr 1fr 120px 170px;
    gap:12px;
    align-items:end;
}

label{
    display:block;
    color:#aaa;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1px;
    margin-bottom:7px;
}

select,
input{
    width:100%;
    height:45px;
    background:#080808;
    border:1px solid #292929;
    border-radius:8px;
    color:#fff;
    padding:0 12px;
    outline:none;
}

select:focus,
input:focus{
    border-color:#ff0000;
}

.generate{
    height:45px;
    border:0;
    border-radius:8px;
    background:#e00000;
    color:#fff;
    font-weight:900;
    letter-spacing:1px;
    cursor:pointer;
    transition:.15s;
}

.generate:hover{
    background:#ff0000;
    transform:translateY(-1px);
}

.generate:active{
    transform:scale(.97);
}

.result-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.result-title{
    color:#ff0000;
    font-size:14px;
    font-weight:900;
    letter-spacing:2px;
}

.copyall{
    background:#151515;
    color:#fff;
    border:1px solid #333;
    border-radius:7px;
    padding:9px 13px;
    cursor:pointer;
    font-size:11px;
    font-weight:bold;
}

.copyall:hover{
    border-color:#ff0000;
    color:#ff0000;
}

.results{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
}

.result-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:#080808;
    border:1px solid #1f1f1f;
    border-radius:8px;
    padding:11px 12px;
    transition:.15s;
}

.result-item:hover{
    border-color:#500000;
}

.result-info{
    min-width:0;
}

.username{
    color:#fff;
    font-size:14px;
    font-weight:bold;
    word-break:break-all;
}

.full-name{
    margin-top:4px;
    color:#777;
    font-size:11px;
    text-transform:capitalize;
}

.copy{
    flex-shrink:0;
    background:#161616;
    border:1px solid #2b2b2b;
    color:#aaa;
    border-radius:6px;
    padding:6px 9px;
    font-size:10px;
    cursor:pointer;
}

.copy:hover{
    color:#fff;
    border-color:#ff0000;
}

.copy.done{
    color:#00ff66;
    border-color:#00ff66;
}

.empty{
    grid-column:1/-1;
    text-align:center;
    color:#444;
    padding:40px 10px;
    user-select:none;
    pointer-events:none;
}

.count{
    text-align:right;
    color:#666;
    font-size:11px;
    margin-top:13px;
}

.footer{
    text-align:center;
    color:#444;
    font-size:10px;
    letter-spacing:2px;
    margin-top:20px;
}

.footer span{
    color:#ff0000;
}

@media(max-width:800px){
    .controls{
        grid-template-columns:1fr 1fr;
    }

    .generate{
        grid-column:1/-1;
    }
}

@media(max-width:600px){
    .results{
        grid-template-columns:1fr;
    }

    .controls{
        grid-template-columns:1fr;
    }

    .generate{
        grid-column:auto;
    }

    .logo{
        font-size:34px;
    }
}
</style>
</head>

/* =========================================================
   HELPER
   ========================================================= */

function randomItem(array){

    return array[
        Math.floor(
            Math.random() * array.length
        )
    ];

}


/*
   Fisher-Yates Shuffle
   Untuk benar-benar mengacak array.
*/

function shuffle(array){

    const arr = [...array];

    for(
        let i = arr.length - 1;
        i > 0;
        i--
    ){

        const j = Math.floor(
            Math.random() * (i + 1)
        );

        [
            arr[i],
            arr[j]
        ] = [
            arr[j],
            arr[i]
        ];

    }

    return arr;
}


/*
   Ambil pasangan nama dari array:

   ["shannon","harrison","rosie","hawkins"]

   menjadi:

   depan:
   shannon
   rosie

   belakang:
   harrison
   hawkins
*/

function prepareNames(list){

    const firstNames = [];
    const lastNames = [];

    for(
        let i = 0;
        i < list.length - 1;
        i += 2
    ){

        firstNames.push(
            list[i]
        );

        lastNames.push(
            list[i + 1]
        );

    }

    return {
        firstNames,
        lastNames
    };

}


/*
   Bersihkan nama untuk username
*/

function cleanName(name){

    return name
        .toLowerCase()
        .replace(/[^a-z0-9]/g,"");

}


/*
   Angka random
*/

function randomNumber(){

    return Math.floor(
        Math.random() * 9000
    ) + 1000;

}


/* =========================================================
   USERNAME GENERATOR
   ========================================================= */

function makeUsername(
    first,
    last,
    style
){

    const f = cleanName(first);
    const l = cleanName(last);

    const num = randomNumber();

    const patterns = {

        aesthetic: [
            `${f}${l}`,
            `${f}.${l}`,
            `${f}_${l}`,
            `${f}${num}`,
            `${f}_${num}`,
            `${f}.${num}`,
            `${f}${l}${num}`,
            `${f}_${l}${num}`
        ],

        clean: [
            `${f}${l}`,
            `${f}${num}`,
            `${f}${l}${num}`,
            `${f}${l.slice(0,2)}`
        ],

        cute: [
            `${f}_${l}`,
            `${f}.${l}`,
            `${f}${num}`,
            `${f}_${num}`,
            `${f}${l}${num}`,
            `${f}.${num}`
        ],

        classy: [
            `${f}.${l}`,
            `${f}${l}`,
            `${f}_${l}`,
            `${f}${l.slice(0,2)}`,
            `${f}${num}`
        ],

        short: [
            `${f.slice(0,4)}${l.slice(0,3)}`,
            `${f.slice(0,5)}${num}`,
            `${f.slice(0,3)}${l.slice(0,3)}`,
            `${f}${l.slice(0,2)}`
        ]

    };


    if(style === "random"){

        const allPatterns = [

            `${f}${l}`,
            `${f}.${l}`,
            `${f}_${l}`,
            `${f}${num}`,
            `${f}_${num}`,
            `${f}.${num}`,
            `${num}${f}`,
            `${num}_${f}`,
            `${f}${l}${num}`,
            `${f}_${l}${num}`,
            `${f}.${l}${num}`,
            `${f}${num}_`,
            `_${f}${num}`,
            `${f}_${num}`

        ];

        return randomItem(
            allPatterns
        );

    }


    return randomItem(
        patterns[style] || patterns.clean
    );

}


/* =========================================================
   GENERATE
   ========================================================= */

let generated = [];


function generate(){

    let amount = parseInt(
        document.getElementById("amount").value
    );

    if(
        isNaN(amount) ||
        amount < 1
    ){

        amount = 1;

    }

    if(amount > 100){

        amount = 100;

    }


    const country =
        document.getElementById("country").value;

    const style =
        document.getElementById("style").value;


    const data =
        prepareNames(
            names[country]
        );


    /*
       ACAK NAMA DEPAN
    */

    const firstNames =
        shuffle(
            data.firstNames
        );


    /*
       ACAK NAMA BELAKANG
    */

    const lastNames =
        shuffle(
            data.lastNames
        );


    generated = [];

    const used =
        new Set();


    /*
       Kita buat kombinasi unik.
       Kalau jumlah lebih banyak daripada
       kombinasi yang tersedia, sistem akan
       berhenti pada kombinasi maksimal.
    */

    let attempts = 0;

    const maxAttempts =
        amount * 50;


    while(
        generated.length < amount &&
        attempts < maxAttempts
    ){

        attempts++;


        /*
           Ambil nama depan secara acak
        */

        const first =
            randomItem(firstNames);


        /*
           Ambil nama belakang secara acak
        */

        const last =
            randomItem(lastNames);


        /*
           Pastikan bukan nama depan = belakang
        */

        if(
            first === last
        ){

            continue;

        }


        const fullName =
            `${first} ${last}`;


        /*
           Hindari pasangan nama yang sama
        */

        if(
            used.has(
                fullName.toLowerCase()
            )
        ){

            continue;

        }


        used.add(
            fullName.toLowerCase()
        );


        const username =
            makeUsername(
                first,
                last,
                style
            );


        generated.push({

            username,
            fullName

        });

    }


    render();

}


/* =========================================================
   RENDER HASIL
   ========================================================= */

function render(){

    const container =
        document.getElementById("results");

    const count =
        document.getElementById("count");


    if(
        generated.length === 0
    ){

        container.innerHTML = `
            <div class="empty">
                Belum ada username.
            </div>
        `;

        count.textContent = "";

        return;

    }


    container.innerHTML =
        generated.map(
            (item,index) => {

                return `

                <div class="result-item">

                    <div class="result-info">

                        <div class="username">
                            ${item.username}
                        </div>

                        <div class="full-name">
                            ${item.fullName}
                        </div>

                    </div>


                    <button
                        class="copy"
                        data-index="${index}"
                    >
                        COPY
                    </button>

                </div>

                `;

            }
        ).join("");


    count.textContent =
        `${generated.length} username generated`;


    document
        .querySelectorAll(".copy")
        .forEach(button => {

            button.addEventListener(
                "click",
                async function(){

                    const index =
                        this.dataset.index;

                    const username =
                        generated[index].username;


                    try{

                        await navigator
                            .clipboard
                            .writeText(
                                username
                            );

                        this.textContent =
                            "COPIED";

                        this.classList.add(
                            "done"
                        );


                        setTimeout(() => {

                            this.textContent =
                                "COPY";

                            this.classList.remove(
                                "done"
                            );

                        },1000);

                    }catch(error){

                        alert(
                            "Gagal copy username."
                        );

                    }

                }
            );

        });

}


/* =========================================================
   COPY ALL
   ========================================================= */

document
    .getElementById("copyAll")
    .addEventListener(
        "click",
        async function(){

            if(
                generated.length === 0
            ){

                return;

            }


            const text =
                generated
                    .map(
                        item =>
                            item.username
                    )
                    .join("\n");


            try{

                await navigator
                    .clipboard
                    .writeText(
                        text
                    );


                const original =
                    this.textContent;


                this.textContent =
                    "✓ COPIED";


                setTimeout(() => {

                    this.textContent =
                        original;

                },1000);


            }catch(error){

                alert(
                    "Gagal copy semua username."
                );

            }

        }
    );
